<!DOCTYPE html>
<!--声明文档类型-->
<!--根标签  所有html内容必须写在根标签中-->
<!--
    双标签   <标签名称 属性=“属性值”></标签名称>
    单标签    <标签名称 />
-->
<html lang="en">
<!--头标签 配置网页信息-->
<head>
<!--  元数据标签  配置字符集编码格式 -->
    <meta charset="UTF-8">   #单标签
<!--    标题标签  配置网页的标题-->
    <title>我是网页标题</title>
<!--    css-->
    <style>
        p{
            color:red
        }
        .box{
            background-color:red
        }
        #ccc{
            border:2px solid blue
        }
    </style>
</head>
<!--主体标签  网页主体内容-->
<body>
    <a href="https://www.baidu.com">百度一下</a>
    <p>我是p标签的内容</p>
    <p>我是p标签的内容</p>
    <p>我是p标签的内容</p>
    <img src="./黑暗之女/黑暗之女.jpg">
<!--div   切割页面-->
    <div class="box aaa" id="ccc">我是div1</div>
    <div>我是div2</div>
    <div class="box">我是div3</div>
    <div>
        <p>
            <a>
                <img src="">
            </a>
        </p>
    </div>
<!--    js-->
    <script>
        let num=10
        console.log(num)
        alert('我是弹窗')
    </script>
</body>
</html>    #根标签
